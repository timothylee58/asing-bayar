name: EAS Build

# Builds only after CI has passed on main. Release profiles read their EXPO_PUBLIC_* values
# from EAS environment variables (eas env:create); app.config.ts fails the build if missing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bayarlah/mobile/package-lock.json

      - name: Install dependencies
        working-directory: bayarlah/mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (preview)
        working-directory: bayarlah/mobile
        run: eas build --platform android --profile preview --non-interactive
